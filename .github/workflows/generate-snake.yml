name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#EA580C&color_dots=#E2E8F0,#BAE6FD,#7DD3FC,#38BDF8,#0284C7&color_bg=#FAFAFA
            dist/github-contribution-grid-snake-dark.svg?color_snake=#FF6B00&color_dots=#18181B,#0369A1,#0284C7,#0EA5E9,#38BDF8&color_bg=#09090B
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Push to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
